name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: smoke the CLI without a key
        shell: bash
        run: |
          out="$(SORTWELL_DIR="$RUNNER_TEMP/sw" node dist/cli.js shortlist)"
          echo "$out"
          grep -q "Nothing open" <<<"$out"
